name: Deploy Production

on:
  push:
    branches:
      - main
    paths:
      # Production release workflow and every helper it directly or transitively executes.
      - ".github/workflows/deploy-production.yml"
      - ".github/scripts/supabase-link-retry.sh"
      - ".github/scripts/detect-pending-high-risk-migrations.sh"
      - ".github/scripts/supabase-advisors-retry.sh"
      - ".github/scripts/validate-migration-phase-metadata.sh"
      - ".github/scripts/migration-diff-lib.sh"
      - ".github/scripts/migration-baseline-compaction.sh"
      - ".github/scripts/supabase-db-push-remote.sh"
      - ".github/scripts/cloudflare-worker-canary.sh"
      - ".github/scripts/resolve-worker-name.sh"
      - ".github/scripts/resolve-production-base-url.sh"
      - ".github/scripts/run-canary-smoke.sh"
      - ".github/scripts/production-smoke.sh"
      - ".github/scripts/authenticated-smoke.sh"
      - ".github/scripts/smoke-lib.sh"
      - ".github/scripts/canary-observe-and-guard.sh"
      - ".github/scripts/manual-production-auth-gate.sh"
      - ".github/scripts/canary-rollback.sh"
      - ".github/scripts/verify-version-affinity.sh"

      # Worker source, static assets, build configuration, and deployment configuration.
      - "web/src/**"
      - "web/public/**"
      - "web/scripts/render-production-env.sh"
      - "web/astro.config.mjs"
      - "web/wrangler.jsonc"
      - "web/package.json"
      - "web/package-lock.json"
      - "web/tsconfig.json"

      # Inputs that this workflow validates and can apply to production Supabase.
      - "supabase/config.toml"
      - "supabase/migrations/**"
      - "supabase/_archived_migrations/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production
  cancel-in-progress: false

jobs:
  migrate-and-canary-5:
    name: Migrate and canary through 5%
    runs-on: ubuntu-latest
    environment: production

    env:
      PUBLIC_SUPABASE_URL: ${{ secrets.PUBLIC_SUPABASE_URL }}
      PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      PUBLIC_TURNSTILE_SITE_KEY: ${{ secrets.PUBLIC_TURNSTILE_SITE_KEY }}
      TURNSTILE_SECRET_KEY: ${{ secrets.TURNSTILE_SECRET_KEY }}
      UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
      UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      RESELLER_PRICE_LIST_FROM: ${{ secrets.RESELLER_PRICE_LIST_FROM }}
      RESELLER_ADMIN_EMAIL: ${{ secrets.RESELLER_ADMIN_EMAIL }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PRODUCTION_BASE_URL: ${{ secrets.PRODUCTION_BASE_URL }}
      CANARY_OBSERVE_SECONDS: ${{ vars.CANARY_OBSERVE_SECONDS }}
      CANARY_MAX_ERROR_RATE: ${{ vars.CANARY_MAX_ERROR_RATE }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: 2.109.1

      - name: Show Supabase CLI version
        run: supabase --version

      - name: Link production Supabase project
        id: supabase_link
        continue-on-error: true
        run: bash .github/scripts/supabase-link-retry.sh "${{ secrets.SUPABASE_PROJECT_REF }}"

      - name: Confirm production migration list
        env:
          SUPABASE_DNS_RESOLVER: https
          SUPABASE_DB_POOLER_URL: ${{ secrets.SUPABASE_DB_POOLER_URL }}
        run: |
          set -euo pipefail
          if [ "${{ steps.supabase_link.outcome }}" = "success" ]; then
            supabase migration list --linked --dns-resolver https | tee migration-list-before.txt
          elif [ -n "${SUPABASE_DB_POOLER_URL:-}" ]; then
            supabase migration list --db-url "$SUPABASE_DB_POOLER_URL" --dns-resolver https | tee migration-list-before.txt
          else
            echo "Cannot confirm migration list without a linked project or SUPABASE_DB_POOLER_URL."
            exit 1
          fi

          {
            echo "### Production migration preflight"
            echo ""
            echo "Review migration-list-before.txt for pending remote migrations."
            echo "For high-risk or Contract releases, confirm backup/recovery evidence is available"
            echo "via the Backup and Rollback workflow before merging to main."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Detect pending high-risk migrations
        id: high_risk_pending
        env:
          SUPABASE_DNS_RESOLVER: https
          SUPABASE_DB_POOLER_URL: ${{ secrets.SUPABASE_DB_POOLER_URL }}
        run: |
          set -euo pipefail
          if [ "${{ steps.supabase_link.outcome }}" = "success" ]; then
            detection="$(bash .github/scripts/detect-pending-high-risk-migrations.sh --pending-linked)"
          elif [ -n "${SUPABASE_DB_POOLER_URL:-}" ]; then
            detection="$(bash .github/scripts/detect-pending-high-risk-migrations.sh --pending-db-url "$SUPABASE_DB_POOLER_URL")"
          else
            echo "high_risk=false" | tee high-risk-detection.txt
            echo "Skipping high-risk detection — Supabase link unavailable." >> high-risk-detection.txt
            echo "high_risk=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          printf '%s\n' "$detection" | tee high-risk-detection.txt
          if head -1 high-risk-detection.txt | grep -q 'high_risk=true'; then
            echo "high_risk=true" >> "$GITHUB_OUTPUT"
          else
            echo "high_risk=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Gate high-risk Expand backup evidence
        env:
          REQUIRE_BACKUP_EVIDENCE_FOR_HIGHRISK: ${{ vars.REQUIRE_BACKUP_EVIDENCE_FOR_HIGHRISK || 'false' }}
        run: |
          set -euo pipefail
          {
            echo "### High-risk pending migrations"
            echo ""
            if [ "${{ steps.high_risk_pending.outputs.high_risk }}" = "true" ]; then
              echo "**High-risk or Contract-phase migrations are pending on production.**"
              echo ""
              echo "Expand-phase high-risk migrations on \`main\` push cannot supply \`backup_run_id\` (workflow_dispatch only)."
              echo "Before merge to \`main\`:"
              echo "1. Run **Backup and Rollback** (\`backup-production-db\`) with \`restore_rehearsal_verified=true\` after restore rehearsal."
              echo "2. Record the backup run id for Contract apply via \`deploy-contract-release.yml\`."
              echo "3. For Expand high-risk DDL, prefer staging rehearsal and production dry-run on the PR."
              echo ""
              sed '1d' high-risk-detection.txt || true
            else
              echo "No high-risk pending migrations detected for this deploy."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "${{ steps.high_risk_pending.outputs.high_risk }}" = "true" ] && [ "$REQUIRE_BACKUP_EVIDENCE_FOR_HIGHRISK" = "true" ]; then
            echo "REQUIRE_BACKUP_EVIDENCE_FOR_HIGHRISK=true — high-risk pending migrations require backup evidence." >&2
            echo "Run Backup and Rollback before production deploy, or apply Contract migrations only via deploy-contract-release.yml." >&2
            exit 1
          fi

      - name: Run production database advisors
        if: steps.supabase_link.outcome == 'success'
        continue-on-error: true
        run: bash .github/scripts/supabase-advisors-retry.sh
        timeout-minutes: 2

      - name: Gate pending migrations (Expand-only + strict metadata)
        env:
          SUPABASE_DNS_RESOLVER: https
          SUPABASE_DB_POOLER_URL: ${{ secrets.SUPABASE_DB_POOLER_URL }}
        run: |
          set -euo pipefail
          # Contract migrations must not auto-apply on main. Strict mode rejects incomplete
          # Contract metadata unless MIGRATION_REVIEWED=true (not set on deploy).
          if [ "${{ steps.supabase_link.outcome }}" = "success" ]; then
            bash .github/scripts/validate-migration-phase-metadata.sh --expand-only --pending-linked
            bash .github/scripts/validate-migration-phase-metadata.sh --strict --pending-linked
          elif [ -n "${SUPABASE_DB_POOLER_URL:-}" ]; then
            bash .github/scripts/validate-migration-phase-metadata.sh --expand-only --pending-db-url "$SUPABASE_DB_POOLER_URL"
            bash .github/scripts/validate-migration-phase-metadata.sh --strict --pending-db-url "$SUPABASE_DB_POOLER_URL"
          else
            echo "Cannot gate pending migrations without a linked project or SUPABASE_DB_POOLER_URL."
            exit 1
          fi

      - name: Apply pending production migrations
        env:
          SUPABASE_DB_POOLER_URL: ${{ secrets.SUPABASE_DB_POOLER_URL }}
        run: |
          if [ "${{ steps.supabase_link.outcome }}" = "success" ]; then
            export SUPABASE_LINKED=true
          else
            export SUPABASE_LINKED=false
          fi
          bash .github/scripts/supabase-db-push-remote.sh

      - name: Show migration status after push
        env:
          SUPABASE_DNS_RESOLVER: https
          SUPABASE_DB_POOLER_URL: ${{ secrets.SUPABASE_DB_POOLER_URL }}
        run: |
          if [ "${{ steps.supabase_link.outcome }}" = "success" ]; then
            supabase migration list --linked --dns-resolver https
          elif [ -n "${SUPABASE_DB_POOLER_URL:-}" ]; then
            supabase migration list --db-url "$SUPABASE_DB_POOLER_URL" --dns-resolver https
          else
            echo "Skipping migration list because Supabase link failed."
            exit 1
          fi

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Cache web node_modules
        id: web-node-modules
        uses: actions/cache@v4
        with:
          path: web/node_modules
          key: web-node-modules-${{ runner.os }}-node-22-${{ hashFiles('web/package-lock.json') }}

      - name: Install web dependencies
        if: steps.web-node-modules.outputs.cache-hit != 'true'
        working-directory: web
        run: npm ci

      - name: Write production env file
        working-directory: web
        run: bash ./scripts/render-production-env.sh

      - name: Build
        working-directory: web
        run: npm run build

      - name: Assert wrangler versions API
        run: bash .github/scripts/cloudflare-worker-canary.sh assert-versions-api

      - name: Capture prior stable Worker version
        id: stable_version
        run: |
          set -euo pipefail
          stable_version_id="$(bash .github/scripts/cloudflare-worker-canary.sh stable-version)"
          if ! printf '%s' "${stable_version_id}" | grep -Eq '^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$'; then
            echo "stable-version must emit exactly one Worker version UUID." >&2
            exit 1
          fi
          printf 'stable_version_id=%s\n' "${stable_version_id}" >> "${GITHUB_OUTPUT}"
          echo "Prior stable Worker version: ${stable_version_id}"

      - name: Upload new Worker version
        id: worker_upload
        run: |
          set -euo pipefail
          new_version_id="$(bash .github/scripts/cloudflare-worker-canary.sh upload --env-file .env.production)"
          if ! printf '%s' "${new_version_id}" | grep -Eq '^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$'; then
            echo "upload must emit exactly one Worker version UUID." >&2
            exit 1
          fi
          printf 'new_version_id=%s\n' "${new_version_id}" >> "${GITHUB_OUTPUT}"
          echo "Uploaded Worker version: ${new_version_id}"

      - name: Resolve production base URL
        run: |
          set -euo pipefail
          PRODUCTION_BASE_URL="$(bash .github/scripts/resolve-production-base-url.sh)"
          echo "PRODUCTION_BASE_URL=${PRODUCTION_BASE_URL}" >> "$GITHUB_ENV"
          echo "Using production base URL: ${PRODUCTION_BASE_URL}"

      - name: Deploy canary at 0% (stable 100%)
        run: |
          bash .github/scripts/cloudflare-worker-canary.sh deploy-split \
            "${{ steps.worker_upload.outputs.new_version_id }}" \
            "${{ steps.stable_version.outputs.stable_version_id }}" \
            0 100 \
            "Production canary: upload at 0% traffic"

      - name: Smoke test uploaded version (0% override)
        env:
          NEW_VERSION_ID: ${{ steps.worker_upload.outputs.new_version_id }}
          STABLE_VERSION_ID: ${{ steps.stable_version.outputs.stable_version_id }}
          WORKER_VERSION_ID: ${{ steps.worker_upload.outputs.new_version_id }}
        run: bash .github/scripts/run-canary-smoke.sh --label "0% version-targeted upload" --public-only --version-targeted

      - name: Observe canary health after 0% upload
        env:
          NEW_VERSION_ID: ${{ steps.worker_upload.outputs.new_version_id }}
          STABLE_VERSION_ID: ${{ steps.stable_version.outputs.stable_version_id }}
          OBSERVATION_LABEL: after 0% upload
        run: bash .github/scripts/canary-observe-and-guard.sh

      - name: Promote canary to 5%
        run: |
          bash .github/scripts/cloudflare-worker-canary.sh deploy-split \
            "${{ steps.worker_upload.outputs.new_version_id }}" \
            "${{ steps.stable_version.outputs.stable_version_id }}" \
            5 95 \
            "Production canary: 5% traffic"

      - name: Smoke test after 5% promotion
        env:
          NEW_VERSION_ID: ${{ steps.worker_upload.outputs.new_version_id }}
          STABLE_VERSION_ID: ${{ steps.stable_version.outputs.stable_version_id }}
        run: bash .github/scripts/run-canary-smoke.sh --label "5% promotion" --public-only

      - name: Observe canary health after 5% promotion
        env:
          NEW_VERSION_ID: ${{ steps.worker_upload.outputs.new_version_id }}
          STABLE_VERSION_ID: ${{ steps.stable_version.outputs.stable_version_id }}
          OBSERVATION_LABEL: after 5% promotion
        run: bash .github/scripts/canary-observe-and-guard.sh

    outputs:
      new_version_id: ${{ steps.worker_upload.outputs.new_version_id }}
      stable_version_id: ${{ steps.stable_version.outputs.stable_version_id }}

  manual-production-auth:
    name: Manual production authentication gate
    needs: migrate-and-canary-5
    runs-on: ubuntu-latest
    environment: production-canary-auth

    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      NEW_VERSION_ID: ${{ needs.migrate-and-canary-5.outputs.new_version_id }}
      STABLE_VERSION_ID: ${{ needs.migrate-and-canary-5.outputs.stable_version_id }}
      WORKER_VERSION_ID: ${{ needs.migrate-and-canary-5.outputs.new_version_id }}
      RUN_ID: ${{ github.run_id }}
      CANARY_STAGE: after-5-percent
      MANUAL_AUTH_ATTESTATION_RESULT: passed

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Cache web node_modules
        id: web-node-modules
        uses: actions/cache@v4
        with:
          path: web/node_modules
          key: web-node-modules-${{ runner.os }}-node-22-${{ hashFiles('web/package-lock.json') }}

      - name: Install web dependencies
        if: steps.web-node-modules.outputs.cache-hit != 'true'
        working-directory: web
        run: npm ci

      - name: Record manual production authentication attestation
        run: bash .github/scripts/manual-production-auth-gate.sh record

  rollback-on-manual-auth-failure:
    name: Roll back canary after manual auth gate failure
    needs:
      - migrate-and-canary-5
      - manual-production-auth
    if: ${{ always() && needs.migrate-and-canary-5.result == 'success' && needs.manual-production-auth.result != 'success' }}
    runs-on: ubuntu-latest
    environment: production

    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      NEW_VERSION_ID: ${{ needs.migrate-and-canary-5.outputs.new_version_id }}
      STABLE_VERSION_ID: ${{ needs.migrate-and-canary-5.outputs.stable_version_id }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Cache web node_modules
        id: web-node-modules
        uses: actions/cache@v4
        with:
          path: web/node_modules
          key: web-node-modules-${{ runner.os }}-node-22-${{ hashFiles('web/package-lock.json') }}

      - name: Install web dependencies
        if: steps.web-node-modules.outputs.cache-hit != 'true'
        working-directory: web
        run: npm ci

      - name: Roll back Worker traffic to stable version
        run: bash .github/scripts/canary-rollback.sh "Manual production authentication gate was not approved."

  canary-promote-remainder:
    name: Promote canary through 100%
    needs:
      - migrate-and-canary-5
      - manual-production-auth
    runs-on: ubuntu-latest
    environment: production

    env:
      PUBLIC_SUPABASE_URL: ${{ secrets.PUBLIC_SUPABASE_URL }}
      PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PRODUCTION_BASE_URL: ${{ secrets.PRODUCTION_BASE_URL }}
      CANARY_OBSERVE_SECONDS: ${{ vars.CANARY_OBSERVE_SECONDS }}
      CANARY_MAX_ERROR_RATE: ${{ vars.CANARY_MAX_ERROR_RATE }}
      NEW_VERSION_ID: ${{ needs.migrate-and-canary-5.outputs.new_version_id }}
      STABLE_VERSION_ID: ${{ needs.migrate-and-canary-5.outputs.stable_version_id }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Cache web node_modules
        id: web-node-modules
        uses: actions/cache@v4
        with:
          path: web/node_modules
          key: web-node-modules-${{ runner.os }}-node-22-${{ hashFiles('web/package-lock.json') }}

      - name: Install web dependencies
        if: steps.web-node-modules.outputs.cache-hit != 'true'
        working-directory: web
        run: npm ci

      - name: Resolve production base URL
        run: |
          set -euo pipefail
          PRODUCTION_BASE_URL="$(bash .github/scripts/resolve-production-base-url.sh)"
          echo "PRODUCTION_BASE_URL=${PRODUCTION_BASE_URL}" >> "$GITHUB_ENV"
          echo "Using production base URL: ${PRODUCTION_BASE_URL}"

      - name: Promote canary to 25%
        run: |
          echo "CANARY_LAST_ATTEMPTED_STAGE=25%" >> "$GITHUB_ENV"
          bash .github/scripts/cloudflare-worker-canary.sh deploy-split \
            "$NEW_VERSION_ID" \
            "$STABLE_VERSION_ID" \
            25 75 \
            "Production canary: 25% traffic"

      - name: Smoke test after 25% promotion
        run: bash .github/scripts/run-canary-smoke.sh --label "25% promotion" --public-only

      - name: Observe canary health after 25% promotion
        env:
          OBSERVATION_LABEL: after 25% promotion
        run: bash .github/scripts/canary-observe-and-guard.sh

      - name: Promote canary to 50%
        run: |
          echo "CANARY_LAST_ATTEMPTED_STAGE=50%" >> "$GITHUB_ENV"
          bash .github/scripts/cloudflare-worker-canary.sh deploy-split \
            "$NEW_VERSION_ID" \
            "$STABLE_VERSION_ID" \
            50 50 \
            "Production canary: 50% traffic"

      - name: Smoke test after 50% promotion
        run: bash .github/scripts/run-canary-smoke.sh --label "50% promotion" --public-only

      - name: Observe canary health after 50% promotion
        env:
          OBSERVATION_LABEL: after 50% promotion
        run: bash .github/scripts/canary-observe-and-guard.sh

      - name: Verify Cloudflare version affinity (best-effort)
        env:
          VERSION_AFFINITY_REQUIRED: ${{ vars.VERSION_AFFINITY_REQUIRED || 'false' }}
        run: |
          set -euo pipefail
          worker_name="$(bash .github/scripts/resolve-worker-name.sh)"
          set +e
          bash .github/scripts/verify-version-affinity.sh \
            --base-url "$PRODUCTION_BASE_URL" \
            --worker-name "$worker_name" \
            --version-a "$NEW_VERSION_ID" \
            --version-b "$STABLE_VERSION_ID"
          affinity_rc=$?
          set -e
          if [ "$affinity_rc" -ne 0 ]; then
            if [ "$VERSION_AFFINITY_REQUIRED" = "true" ]; then
              echo "Version affinity verification failed (VERSION_AFFINITY_REQUIRED=true)." >&2
              exit "$affinity_rc"
            fi
            echo "::warning::Version affinity verification did not pass (VERSION_AFFINITY_REQUIRED=false). See step log for operator checklist."
          fi

      - name: Promote canary to 100%
        run: |
          echo "CANARY_LAST_ATTEMPTED_STAGE=100%" >> "$GITHUB_ENV"
          bash .github/scripts/cloudflare-worker-canary.sh deploy-split \
            "$NEW_VERSION_ID" \
            "$STABLE_VERSION_ID" \
            100 0 \
            "Production canary: 100% traffic"

      - name: Smoke test after full promotion
        run: bash .github/scripts/run-canary-smoke.sh --label "100% promotion" --public-only

      - name: Observe canary health after 100% promotion
        env:
          OBSERVATION_LABEL: after 100% promotion
        run: bash .github/scripts/canary-observe-and-guard.sh

      - name: Record promotion context
        if: always()
        id: promotion_context
        run: |
          echo "last_attempted_stage=${CANARY_LAST_ATTEMPTED_STAGE:-before-25-percent}" >> "$GITHUB_OUTPUT"

      - name: Write release summary
        if: success()
        run: |
          {
            echo "### Production release"
            echo ""
            echo "| Field | Value |"
            echo "| --- | --- |"
            echo "| Commit | \`${{ github.sha }}\` |"
            echo "| New Worker version | \`${NEW_VERSION_ID}\` |"
            echo "| Prior stable Worker version (rollback target) | \`${STABLE_VERSION_ID}\` |"
            echo "| Canary path | 0% → 5% → manual auth gate → 25% → 50% → 100% |"
            echo "| Manual auth gate | after 5% promotion (\`production-canary-auth\`) |"
            echo "| Last attempted stage | 100% (completed) |"
            echo "| Rollback target | \`${STABLE_VERSION_ID}\` |"
            echo "| Rollback attempted | no |"
            echo "| Rollback outcome | not required |"
            echo ""
            echo "#### Immediate rollback"
            echo ""
            echo "Reverse Worker traffic first (do not auto DB down-migrate):"
            echo ""
            echo '```bash'
            echo "bash .github/scripts/cloudflare-worker-canary.sh deploy-split \\"
            echo "  \"${STABLE_VERSION_ID}\" \\"
            echo "  \"${NEW_VERSION_ID}\" \\"
            echo "  100 0"
            echo '```'
            echo ""
            echo "#### Version affinity during gradual rollout"
            echo ""
            echo "Configure a Cloudflare Transform Rule to set \`Cloudflare-Workers-Version-Key\`"
            echo "from a stable cookie or session identifier so HTML/assets/API requests stay on"
            echo "the same Worker version during percentage-based rollouts."
            echo "See: https://developers.cloudflare.com/workers/configuration/versions-and-deployments/gradual-deployments/version-affinity/"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Write remainder failure summary
        if: failure()
        run: |
          {
            echo "### Production canary remainder failure"
            echo ""
            echo "| Field | Value |"
            echo "| --- | --- |"
            echo "| Last attempted stage | ${CANARY_LAST_ATTEMPTED_STAGE:-unknown} |"
            echo "| Rollback target (stable@100%) | \`${STABLE_VERSION_ID}\` |"
            echo "| Canary version | \`${NEW_VERSION_ID}\` |"
            echo "| Rollback attempted | pending independent rollback job |"
            echo "| Rollback outcome | see rollback-on-remainder-failure job |"
          } >> "$GITHUB_STEP_SUMMARY"

    outputs:
      last_attempted_stage: ${{ steps.promotion_context.outputs.last_attempted_stage }}

  rollback-on-remainder-failure:
    name: Roll back canary after remainder promotion failure
    needs:
      - migrate-and-canary-5
      - manual-production-auth
      - canary-promote-remainder
    if: ${{ always() && needs.migrate-and-canary-5.result == 'success' && needs.manual-production-auth.result == 'success' && needs.canary-promote-remainder.result != 'success' }}
    runs-on: ubuntu-latest
    environment: production

    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      NEW_VERSION_ID: ${{ needs.migrate-and-canary-5.outputs.new_version_id }}
      STABLE_VERSION_ID: ${{ needs.migrate-and-canary-5.outputs.stable_version_id }}
      CANARY_LAST_ATTEMPTED_STAGE: ${{ needs.canary-promote-remainder.outputs.last_attempted_stage }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Cache web node_modules
        id: web-node-modules
        uses: actions/cache@v4
        with:
          path: web/node_modules
          key: web-node-modules-${{ runner.os }}-node-22-${{ hashFiles('web/package-lock.json') }}

      - name: Install web dependencies
        if: steps.web-node-modules.outputs.cache-hit != 'true'
        working-directory: web
        run: npm ci

      - name: Roll back Worker traffic to stable version
        run: bash .github/scripts/canary-rollback.sh "Canary remainder promotion did not complete successfully."

      - name: Write remainder rollback summary
        if: always()
        run: |
          {
            echo "### Remainder failure rollback outcome"
            echo ""
            echo "| Field | Value |"
            echo "| --- | --- |"
            echo "| Last attempted stage | ${CANARY_LAST_ATTEMPTED_STAGE:-unknown} |"
            echo "| Rollback target (stable@100%) | \`${STABLE_VERSION_ID}\` |"
            echo "| Canary version (set to 0%) | \`${NEW_VERSION_ID}\` |"
            echo "| Rollback attempted | yes |"
            echo "| Rollback outcome | ${{ job.status }} |"
          } >> "$GITHUB_STEP_SUMMARY"

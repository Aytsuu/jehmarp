name: Feature Branch CI

on:
  push:
    branches-ignore:
      - main
      - dev

permissions:
  contents: read

concurrency:
  group: feature-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
  PUBLIC_SUPABASE_PUBLISHABLE_KEY: ci_publishable_key
  SUPABASE_SECRET_KEY: ci_secret_key
  PUBLIC_TURNSTILE_SITE_KEY: ci_turnstile_site_key
  TURNSTILE_SECRET_KEY: ci_turnstile_secret_key
  UPSTASH_REDIS_REST_URL: https://redis.example.test
  UPSTASH_REDIS_REST_TOKEN: ci_redis_token

jobs:
  detect-changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      supabase: ${{ steps.filter.outputs.supabase }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect supabase changes
        id: filter
        shell: bash
        run: |
          set -euo pipefail

          if [ "${{ github.event.before }}" = "0000000000000000000000000000000000000000" ]; then
            if git ls-tree -r --name-only HEAD -- supabase | grep -q .; then
              echo "supabase=true" >> "$GITHUB_OUTPUT"
            else
              echo "supabase=false" >> "$GITHUB_OUTPUT"
            fi
            exit 0
          fi

          if git diff --name-only "${{ github.event.before }}" "${{ github.sha }}" -- supabase/ | grep -q .; then
            echo "supabase=true" >> "$GITHUB_OUTPUT"
          else
            echo "supabase=false" >> "$GITHUB_OUTPUT"
          fi

  web:
    name: Web checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Cache web node_modules
        id: web-node-modules
        uses: actions/cache@v4
        with:
          path: web/node_modules
          key: web-node-modules-${{ runner.os }}-node-22-${{ hashFiles('web/package-lock.json') }}

      - name: Install web dependencies
        if: steps.web-node-modules.outputs.cache-hit != 'true'
        working-directory: web
        run: npm ci

      - name: Astro check
        working-directory: web
        run: npm run check

      - name: Lint
        working-directory: web
        run: npm run lint

      - name: Test
        working-directory: web
        run: npm run test

      - name: Build
        working-directory: web
        run: npm run build

  supabase:
    name: Local Supabase checks
    needs: detect-changes
    if: needs.detect-changes.outputs.supabase == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate new migration metadata and expand SQL
        shell: bash
        run: |
          set -euo pipefail

          if [ "${{ github.event.before }}" = "0000000000000000000000000000000000000000" ]; then
            echo "Initial branch push; skipping added-migration metadata gate."
            exit 0
          fi

          added_files="$(git diff --diff-filter=A --name-only "${{ github.event.before }}" "${{ github.sha }}" -- supabase/migrations || true)"
          if [ -z "${added_files}" ]; then
            echo "No newly added migration files in this push."
            exit 0
          fi

          metadata_args=(--require-phase-for-added)
          file_args=(--files)
          while IFS= read -r file; do
            [ -z "${file}" ] && continue
            metadata_args+=(--added-files "${file}")
            file_args+=("${file}")
          done <<< "${added_files}"

          bash .github/scripts/validate-migration-phase-metadata.sh "${metadata_args[@]}" "${file_args[@]}"
          bash .github/scripts/validate-expand-migration-sql.sh "${file_args[@]}"

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: 2.109.1

      - name: Show Supabase CLI version
        run: supabase --version

      - name: Start local Supabase
        run: supabase start

      - name: Replay local migrations
        run: supabase db reset --local --no-seed

      - name: Lint local database
        run: supabase db lint --local --fail-on error

      - name: Run SQL tests
        run: bash supabase/tests/run.sh

name: Dependency and Security

on:
  schedule:
    - cron: "0 19 * * 1"
  pull_request:
    paths:
      - "web/package.json"
      - "web/package-lock.json"
      - ".github/workflows/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dependency-audit:
    name: Dependency audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Cache web node_modules
        id: web-node-modules
        uses: actions/cache@v4
        with:
          path: web/node_modules
          key: web-node-modules-${{ runner.os }}-node-22-${{ hashFiles('web/package-lock.json') }}

      - name: Install web dependencies
        if: steps.web-node-modules.outputs.cache-hit != 'true'
        working-directory: web
        run: npm ci

      - name: Audit production dependencies
        working-directory: web
        run: npm audit --audit-level=high --omit=dev

      - name: Check public environment variable names
        shell: bash
        run: |
          set -euo pipefail
          if grep -RInE "PUBLIC_[A-Z0-9_]*(SECRET|TOKEN|PASSWORD|SERVICE_ROLE)" web/src web/.env.example web/README.md .env.example 2>/dev/null; then
            echo "Potentially sensitive PUBLIC_* variable name found."
            exit 1
          fi

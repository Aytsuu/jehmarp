name: Deploy Staging

on:
  push:
    branches:
      - dev

permissions:
  contents: read

concurrency:
  group: staging
  cancel-in-progress: false

jobs:
  deploy-staging:
    name: Deploy staging
    runs-on: ubuntu-latest
    environment: staging

    env:
      PUBLIC_SUPABASE_URL: ${{ secrets.PUBLIC_SUPABASE_URL }}
      PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      PUBLIC_TURNSTILE_SITE_KEY: ${{ secrets.PUBLIC_TURNSTILE_SITE_KEY }}
      TURNSTILE_SECRET_KEY: ${{ secrets.TURNSTILE_SECRET_KEY }}
      UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
      UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      RESELLER_PRICE_LIST_FROM: ${{ secrets.RESELLER_PRICE_LIST_FROM }}
      RESELLER_ADMIN_EMAIL: ${{ secrets.RESELLER_ADMIN_EMAIL }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      STAGING_BASE_URL: ${{ secrets.STAGING_BASE_URL }}
      STAGING_SESSION_KV_ID: ${{ secrets.STAGING_SESSION_KV_ID }}
      SMOKE_ADMIN_EMAIL: ${{ secrets.SMOKE_ADMIN_EMAIL }}
      SMOKE_ADMIN_PASSWORD: ${{ secrets.SMOKE_ADMIN_PASSWORD }}
      CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
      CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
      SMOKE_TURNSTILE_RESPONSE: ${{ secrets.SMOKE_TURNSTILE_RESPONSE }}
      AUTH_SMOKE_OPTIONAL: "true"
      AUTH_SMOKE_ROLE: admin
      AUTH_SMOKE_TARGET_ENV: staging
      AUTH_SMOKE_TURNSTILE_MODE: test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Cache web node_modules
        id: web-node-modules
        uses: actions/cache@v4
        with:
          path: web/node_modules
          key: web-node-modules-${{ runner.os }}-node-22-${{ hashFiles('web/package-lock.json') }}

      - name: Install web dependencies
        if: steps.web-node-modules.outputs.cache-hit != 'true'
        working-directory: web
        run: npm ci

      - name: Astro check
        working-directory: web
        run: npm run check

      - name: Lint
        working-directory: web
        run: npm run lint

      - name: Test
        working-directory: web
        run: npm run test

      - name: Build application checks
        working-directory: web
        run: npm run build

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: 2.109.1

      - name: Show Supabase CLI version
        run: supabase --version

      - name: Start local Supabase
        run: supabase start

      - name: Replay local migrations
        run: supabase db reset --local --no-seed

      - name: Lint local database
        run: supabase db lint --local --fail-on error

      - name: Run SQL tests
        run: bash supabase/tests/run.sh

      - name: Link staging Supabase project
        id: supabase_link
        continue-on-error: true
        run: bash .github/scripts/supabase-link-retry.sh "${{ secrets.SUPABASE_PROJECT_REF }}"

      - name: Show linked migration status
        env:
          SUPABASE_DNS_RESOLVER: https
          SUPABASE_DB_POOLER_URL: ${{ secrets.SUPABASE_DB_POOLER_URL }}
        run: |
          if [ "${{ steps.supabase_link.outcome }}" = "success" ]; then
            supabase migration list --linked --dns-resolver https
          elif [ -n "${SUPABASE_DB_POOLER_URL:-}" ]; then
            supabase migration list --db-url "$SUPABASE_DB_POOLER_URL" --dns-resolver https
          else
            echo "Skipping migration list because Supabase link failed."
            exit 1
          fi

      - name: Assert Supabase baseline ledger state
        env:
          SUPABASE_DNS_RESOLVER: https
          SUPABASE_DB_POOLER_URL: ${{ secrets.SUPABASE_DB_POOLER_URL }}
          BASELINE_LEDGER_TARGET: staging
        run: |
          if [ "${{ steps.supabase_link.outcome }}" = "success" ]; then
            bash .github/scripts/assert-supabase-baseline-ledger-state.sh --linked --target staging --policy active-prefix
          elif [ -n "${SUPABASE_DB_POOLER_URL:-}" ]; then
            bash .github/scripts/assert-supabase-baseline-ledger-state.sh \
              --db-url "$SUPABASE_DB_POOLER_URL" \
              --target staging \
              --policy active-prefix
          else
            echo "Cannot assert baseline ledger state without a linked project or SUPABASE_DB_POOLER_URL."
            exit 1
          fi

      - name: Gate pending migrations for Expand-only auto-push
        env:
          SUPABASE_DNS_RESOLVER: https
          SUPABASE_DB_POOLER_URL: ${{ secrets.SUPABASE_DB_POOLER_URL }}
        run: |
          # Contract migrations must not auto-apply on dev pushes. Only Expand-eligible
          # pending migrations may proceed unless MIGRATION_PHASE_ALLOW_CONTRACT=true.
          if [ "${{ steps.supabase_link.outcome }}" = "success" ]; then
            bash .github/scripts/validate-migration-phase-metadata.sh --expand-only --pending-linked
          elif [ -n "${SUPABASE_DB_POOLER_URL:-}" ]; then
            bash .github/scripts/validate-migration-phase-metadata.sh --expand-only --pending-db-url "$SUPABASE_DB_POOLER_URL"
          else
            echo "Cannot gate pending migrations without a linked project or SUPABASE_DB_POOLER_URL."
            exit 1
          fi

      - name: Apply pending staging migrations
        env:
          SUPABASE_DB_POOLER_URL: ${{ secrets.SUPABASE_DB_POOLER_URL }}
        run: |
          if [ "${{ steps.supabase_link.outcome }}" = "success" ]; then
            export SUPABASE_LINKED=true
          else
            export SUPABASE_LINKED=false
          fi
          bash .github/scripts/supabase-db-push-remote.sh

      - name: Show migration status after push
        env:
          SUPABASE_DNS_RESOLVER: https
          SUPABASE_DB_POOLER_URL: ${{ secrets.SUPABASE_DB_POOLER_URL }}
        run: |
          if [ "${{ steps.supabase_link.outcome }}" = "success" ]; then
            supabase migration list --linked --dns-resolver https
          elif [ -n "${SUPABASE_DB_POOLER_URL:-}" ]; then
            supabase migration list --db-url "$SUPABASE_DB_POOLER_URL" --dns-resolver https
          else
            echo "Skipping migration list because Supabase link failed."
            exit 1
          fi

      - name: Run staging database advisors
        if: steps.supabase_link.outcome == 'success'
        run: bash .github/scripts/supabase-advisors-retry.sh
        timeout-minutes: 2

      - name: Write staging env file
        working-directory: web
        run: bash ./scripts/render-staging-env.sh

      - name: Build staging Worker
        working-directory: web
        run: npm run build

      - name: Assert staging worker isolation
        run: bash .github/scripts/assert-staging-worker-isolation.sh

      - name: Inject staging SESSION KV id
        run: bash .github/scripts/inject-staging-kv-id.sh

      - name: Prepare generated staging Worker config
        working-directory: web
        run: bash ../.github/scripts/prepare-staging-wrangler-config.sh

      - name: Deploy staging Worker
        working-directory: web
        run: npx wrangler deploy --config dist/server/wrangler.json --env-file .env.staging

      - name: Verify staging worker name
        run: |
          set -euo pipefail
          staging_name="$(WRANGLER_ENV=staging bash .github/scripts/resolve-worker-name.sh)"
          production_name="$(bash .github/scripts/resolve-worker-name.sh)"
          if [ "${staging_name}" = "${production_name}" ]; then
            echo "Staging deploy resolved to production worker name: ${production_name}" >&2
            exit 1
          fi
          echo "Staging worker: ${staging_name}"

      - name: Resolve staging base URL
        shell: bash
        run: |
          set -euo pipefail
          STAGING_BASE_URL="$(bash .github/scripts/resolve-staging-base-url.sh)"
          echo "Using staging base URL: ${STAGING_BASE_URL}"
          echo "STAGING_BASE_URL=${STAGING_BASE_URL}" >> "$GITHUB_ENV"

      - name: Check public pages
        shell: bash
        run: bash .github/scripts/production-smoke.sh

      - name: Run authenticated staging smoke checks
        shell: bash
        run: bash .github/scripts/authenticated-smoke.sh

      - name: Write staging evidence
        env:
          SUPABASE_DNS_RESOLVER: https
          SUPABASE_DB_POOLER_URL: ${{ secrets.SUPABASE_DB_POOLER_URL }}
        run: |
          if [ "${{ steps.supabase_link.outcome }}" = "success" ]; then
            export SUPABASE_LINKED=true
          else
            export SUPABASE_LINKED=false
          fi
          bash .github/scripts/write-staging-evidence.sh staging-evidence

      - name: Upload staging evidence artifact
        uses: actions/upload-artifact@v4
        with:
          name: staging-evidence
          path: staging-evidence/
          retention-days: 90
          if-no-files-found: error

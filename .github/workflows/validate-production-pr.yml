name: Validate Production PR

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read
  pull-requests: read
  actions: read

concurrency:
  group: validate-production-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate dev to main
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'dev' && github.event.pull_request.base.ref == 'main'
    runs-on: ubuntu-latest
    # Keep PR-controlled build and test commands free of production credentials.
    env:
      MIGRATION_REVIEWED: ${{ contains(github.event.pull_request.labels.*.name, 'migration-reviewed') }}
      CONTRACT_RELEASE: ${{ contains(github.event.pull_request.labels.*.name, 'contract-release') }}
      # Deploy Staging is triggered by the same dev push and may finish after
      # the local validation steps. Wait only a bounded time for its evidence.
      STAGING_EVIDENCE_WAIT_ATTEMPTS: "30"
      STAGING_EVIDENCE_WAIT_INTERVAL_SECONDS: "20"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Cache web node_modules
        id: web-node-modules
        uses: actions/cache@v4
        with:
          path: web/node_modules
          key: web-node-modules-${{ runner.os }}-node-22-${{ hashFiles('web/package-lock.json') }}

      - name: Install web dependencies
        if: steps.web-node-modules.outputs.cache-hit != 'true'
        working-directory: web
        run: npm ci

      - name: Astro check
        working-directory: web
        run: npm run check

      - name: Lint
        working-directory: web
        run: npm run lint

      - name: Test
        working-directory: web
        run: npm run test

      - name: Build
        working-directory: web
        run: npm run build

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: 2.109.1

      - name: Show Supabase CLI version
        run: supabase --version

      - name: Start local Supabase
        run: supabase start

      - name: Replay local migrations
        run: supabase db reset --local --no-seed

      - name: Lint local database
        run: supabase db lint --local --fail-on error

      - name: Run SQL tests
        run: bash supabase/tests/run.sh

      - name: Find successful Deploy Staging run for PR head
        id: staging_run
        uses: actions/github-script@v7
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        with:
          script: |
            const headSha = process.env.HEAD_SHA;
            const { owner, repo } = context.repo;
            const maxAttempts = Number(process.env.STAGING_EVIDENCE_WAIT_ATTEMPTS);
            const waitIntervalSeconds = Number(process.env.STAGING_EVIDENCE_WAIT_INTERVAL_SECONDS);

            if (!Number.isInteger(maxAttempts) || maxAttempts < 1 ||
                !Number.isInteger(waitIntervalSeconds) || waitIntervalSeconds < 1) {
              core.setFailed('Staging evidence wait configuration must use positive integer attempts and interval seconds.');
              return;
            }

            const workflows = await github.rest.actions.listRepoWorkflows({ owner, repo });
            const stagingWorkflow = workflows.data.workflows.find(
              (workflow) => workflow.name === 'Deploy Staging' && workflow.state === 'active',
            );

            if (!stagingWorkflow) {
              core.setFailed('Deploy Staging workflow was not found in this repository.');
              return;
            }

            let successRun;
            let latestRuns = [];
            for (let attempt = 1; attempt <= maxAttempts; attempt += 1) {
              const runs = await github.rest.actions.listWorkflowRuns({
                owner,
                repo,
                workflow_id: stagingWorkflow.id,
                head_sha: headSha,
                per_page: 100,
              });

              latestRuns = runs.data.workflow_runs;
              successRun = latestRuns.find((run) => run.conclusion === 'success');
              if (successRun) {
                break;
              }

              const activeRuns = latestRuns.filter((run) => run.status !== 'completed');
              if (activeRuns.length > 0 || latestRuns.length === 0) {
                if (attempt < maxAttempts) {
                  core.info(
                    `Waiting ${waitIntervalSeconds}s for active Deploy Staging workflow run ` +
                      `for commit ${headSha} (${attempt}/${maxAttempts}).`,
                  );
                  await new Promise((resolve) => setTimeout(resolve, waitIntervalSeconds * 1000));
                  continue;
                }
                break;
              }

              const failedRuns = latestRuns
                .map((run) => `${run.html_url} (${run.conclusion ?? run.status})`)
                .join(', ');
              core.setFailed(`Matching completed staging workflow run(s) failed for commit ${headSha}: ${failedRuns}`);
              return;
            }

            if (!successRun) {
              const observedRuns = latestRuns.length === 0
                ? 'No matching Deploy Staging run was observed.'
                : latestRuns.map((run) => `${run.html_url} (${run.status}/${run.conclusion ?? 'pending'})`).join(', ');
              core.setFailed(
                `No successful Deploy Staging workflow run found for commit ${headSha} after ` +
                  `${maxAttempts * waitIntervalSeconds}s. ${observedRuns}`,
              );
              return;
            }

            core.setOutput('run_id', String(successRun.id));
            core.setOutput('run_url', successRun.html_url);
            core.summary.addHeading('Staging evidence');
            core.summary.addLink('Deploy Staging run', successRun.html_url);
            core.summary.addRaw(`\nCommit: \`${headSha}\`\n`, true);
            await core.summary.write();

      - name: Download staging evidence artifact
        id: staging_artifact
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: staging-evidence
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ steps.staging_run.outputs.run_id }}
          path: staging-evidence

      - name: Verify staging evidence and migration history
        shell: bash
        env:
          STAGING_EVIDENCE_OPTIONAL: ${{ vars.STAGING_EVIDENCE_OPTIONAL }}
        run: |
          set -euo pipefail

          if [ "${{ steps.staging_artifact.outcome }}" != "success" ]; then
            {
              echo "### Staging evidence artifact"
              echo ""
              echo "Deploy Staging succeeded for this commit, but no \`staging-evidence\` artifact was found."
              echo "Migration history audit requires a staging deploy that uploads evidence."
              echo "Re-run Deploy Staging on \`dev\` after the evidence upload step is on the branch."
              if [ "${STAGING_EVIDENCE_OPTIONAL:-}" = "true" ]; then
                echo ""
                echo "STAGING_EVIDENCE_OPTIONAL=true is set; continuing without staging evidence."
              fi
            } >> "$GITHUB_STEP_SUMMARY"

            if [ "${STAGING_EVIDENCE_OPTIONAL:-}" = "true" ]; then
              echo "WARN: staging-evidence artifact missing; STAGING_EVIDENCE_OPTIONAL=true allows bypass."
              exit 0
            fi

            echo "staging-evidence artifact is required for production PR validation." >&2
            exit 1
          fi

          bash .github/scripts/verify-staging-evidence.sh staging-evidence "${{ github.event.pull_request.head.sha }}"

      - name: Collect migrations changed since main
        id: changed_migrations
        shell: bash
        run: |
          set -euo pipefail

          git fetch origin main --depth=1
          audit_files="$(bash .github/scripts/list-diff-migration-files.sh --diff-base origin/main --mode all || true)"
          current_files="$(bash .github/scripts/list-diff-migration-files.sh --diff-base origin/main --mode current || true)"

          if [ -z "${audit_files}" ]; then
            echo "has_changed_migrations=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "has_changed_migrations=true" >> "$GITHUB_OUTPUT"
          {
            echo "audit_files<<EOF"
            echo "${audit_files}"
            echo "EOF"
            echo "current_files<<EOF"
            echo "${current_files}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

          echo "Migration audit paths (all statuses):"
          echo "${audit_files}"
          if [ -n "${current_files}" ]; then
            echo "Current scanable migration files:"
            echo "${current_files}"
          else
            echo "No current scanable migration files (deletions-only change)."
          fi

      - name: Scan changed migrations for high-risk SQL
        if: steps.changed_migrations.outputs.has_changed_migrations == 'true'
        shell: bash
        env:
          MIGRATION_REVIEWED: ${{ contains(github.event.pull_request.labels.*.name, 'migration-reviewed') }}
          CONTRACT_RELEASE: ${{ contains(github.event.pull_request.labels.*.name, 'contract-release') }}
        run: |
          set -euo pipefail

          if ! bash .github/scripts/validate-expand-migration-sql.sh --diff-base origin/main; then
            {
              echo "### Expand SQL validation failed"
              echo ""
              echo "Migrations with \`migration-phase: expand\` must be additive-only."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          bash .github/scripts/scan-changed-migrations-high-risk.sh \
            --diff-base origin/main \
            --policy production-pr

      - name: Validate changed migration metadata
        if: steps.changed_migrations.outputs.has_changed_migrations == 'true'
        shell: bash
        run: |
          set -euo pipefail

          set +e
          metadata_output="$(
            MIGRATION_REVIEWED="${MIGRATION_REVIEWED}" \
              bash .github/scripts/validate-migration-phase-metadata.sh \
              --diff-base origin/main \
              --require-phase-for-added 2>&1
          )"
          metadata_status=$?
          set -e

          echo "${metadata_output}"

          if echo "${metadata_output}" | grep -q '^WARN:'; then
            {
              echo "### Migration metadata warnings"
              echo ""
              echo "Modified legacy migrations without \`migration-phase\` headers were warned instead of failing."
              echo "Newly added migrations in this promotion must include complete metadata."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

          if [ "${metadata_status}" -ne 0 ]; then
            {
              echo "### Migration metadata validation failed"
              echo ""
              echo "Newly added migration files must include complete \`migration-phase\` metadata."
              echo "Changed migrations with headers must include complete Expand or Contract fields."
              echo "Contract migrations additionally require compatibility-window, legacy-usage, and backup evidence."
              echo "Add the \`contract-release\` or \`migration-reviewed\` label after manual review."
              echo "Contract apply happens only via \`deploy-contract-release.yml\` (not automatic on main push)."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      - name: Note schema-facing verification scope
        shell: bash
        run: |
          set -euo pipefail

          git fetch origin main --depth=1
          schema_changes="$(git diff --name-only origin/main...HEAD -- supabase web/src/lib || true)"

          {
            echo "### Schema-facing verification"
            echo ""
            if [ -z "${schema_changes}" ]; then
              echo "No \`supabase/**\` or \`web/src/lib/**\` changes detected; skipped dedicated typegen reminder."
            else
              echo "Schema-facing paths changed in this promotion:"
              echo '```'
              echo "${schema_changes}"
              echo '```'
              echo ""
              echo "This repository does not yet commit generated Supabase TypeScript types."
              echo "Reviewers should confirm application types and RPC usage still match the schema."
              echo "Vitest coverage in this workflow exercises RPC call sites with mocked contracts."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
